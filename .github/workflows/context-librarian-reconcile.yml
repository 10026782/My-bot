name: Context Librarian Reconciliation

# Pushes classify and surface owner decisions. Scheduled/manual runs perform
# bounded maintenance on one bot-owned rolling branch and PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: context-librarian-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.reconcile.outputs.outcome }}
      sha: ${{ steps.reconcile.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reconcile (check only)
        id: reconcile
        run: |
          set -euo pipefail
          set +e
          python -m tools.context_librarian reconcile --check --main-ref origin/main > reconcile.json
          set -e
          outcome="$(python -c "import json;print(json.load(open('reconcile.json'))['outcome'])")"
          sha="$(python -c "import json;print(json.load(open('reconcile.json'))['canonical_main_sha'])")"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Report owner decisions needed
        if: steps.reconcile.outputs.outcome == 'OWNER_DECISION_REQUIRED'
        run: |
          {
            echo "## Context Librarian — owner decision required"
            echo
            python - <<'PY'
          import json
          data = json.load(open("reconcile.json"))
          for item in data["decision_queue"]:
              label = item.get("policy_id", "no matching policy")
              note = item.get("policy_note", "")
              suffix = f" -- {note}" if note else ""
              print(f"- `{item['path']}` — {item['classification']} ({label}){suffix}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail visibly on owner decision required
        if: steps.reconcile.outputs.outcome == 'OWNER_DECISION_REQUIRED'
        run: exit 1

  maintain-rolling-pr:
    needs: check
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.check.outputs.outcome == 'AUTO_MAINTENANCE_REQUIRED'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ROLLING_BRANCH: context-librarian/auto-maintenance
      BOT_EMAIL: context-librarian-bot@users.noreply.github.com
      PR_TITLE: "chore(context-librarian): bounded auto-maintenance"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh current main and prove rolling branch ownership
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$ROLLING_BRANCH" --no-tags || git fetch origin main --no-tags
          git checkout --detach origin/main
          sha="$(git rev-parse origin/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$ROLLING_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ROLLING_BRANCH" --no-tags
            rolling_sha="$(git rev-parse FETCH_HEAD)"
            for commit in $(git rev-list origin/main.."$rolling_sha"); do
              test "$(git show -s --format=%ae "$commit")" = "$BOT_EMAIL"
              test "$(git show -s --format=%ce "$commit")" = "$BOT_EMAIL"
            done || {
              echo "::error::rolling branch provenance is not exclusively bot-owned; refusing to replace it"
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-check current main before writing
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "${{ steps.guard.outputs.sha }}"
          set +e
          python -m tools.context_librarian reconcile --check --main-ref origin/main > reconcile.json
          reconcile_status=$?
          set -e
          test -s reconcile.json
          outcome="$(python -c "import json;print(json.load(open('reconcile.json'))['outcome'])" 2>/dev/null)" || {
            echo "::error::reconcile produced invalid JSON"
            exit 1
          }
          test "$outcome" = AUTO_MAINTENANCE_REQUIRED || {
            echo "::error::unexpected reconcile outcome: $outcome"
            exit 1
          }
          if [ "$reconcile_status" -ne 0 ] && [ "$reconcile_status" -ne 2 ]; then
            echo "::error::unexpected reconcile exit code: $reconcile_status"
            exit 1
          fi
      - name: Apply bounded maintenance on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.context_librarian reconcile --apply-auto --main-ref origin/main
          git switch -C "$ROLLING_BRANCH"
          if git diff --quiet -- docs/context_librarian; then
            echo "::error::AUTO_MAINTENANCE_REQUIRED produced no bounded catalog diff"
            exit 1
          fi
          git config user.name context-librarian-bot
          git config user.email "$BOT_EMAIL"
          git add docs/context_librarian
          git commit -m "chore(context-librarian): bounded auto-maintenance"
          git push --force-with-lease origin "$ROLLING_BRANCH"
      - name: Create or update the single rolling PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.guard.outputs.sha }}"
          summary="$(python -c "import json; d=json.load(open('reconcile.json')); print('mechanical_updates=' + str(len(d['mechanical_updates'])) + ', auto_maintenance_sources=' + str(len(d['auto_maintenance_sources'])))")"
          body="Automated, policy-bounded catalog maintenance.\n\nLatest reconciled main SHA: $sha\nPrevious rolling baseline: managed by the canonical branch history\nMaintenance summary: $summary\n\nNever writes directly to main or merges automatically. Human review is required. See docs/context_librarian/RECONCILIATION.md."
          mapfile -t prs < <(gh pr list --head "$ROLLING_BRANCH" --base main --state open --json number --jq '.[].number')
          if [ "${#prs[@]}" -gt 1 ]; then
            echo "::error::more than one open rolling maintenance PR exists; refusing to create or mutate another"
            exit 1
          elif [ "${#prs[@]}" -eq 1 ]; then
            gh pr edit "${prs[0]}" --title "$PR_TITLE" --body "$body"
          else
            gh pr create --base main --head "$ROLLING_BRANCH" --title "$PR_TITLE" --body "$body"
          fi
