name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      # PATCH 3B Step 6 prerequisite: these are NOT real credentials. A real
      # AIRTABLE_API_KEY/AIRTABLE_BASE_ID (secrets.*) used to be wired here,
      # and a test-isolation bug in test_emergency_stop_bootstrap.py (fixed
      # in commit 1967dd4) let assertions run outside their mock context —
      # which meant those calls silently succeeded against the LIVE
      # production Emergency Stop Flags table instead of failing loudly.
      # Fixing that one bug isn't enough: unit CI must never hold real
      # Airtable credentials at all, so any *future* test-isolation bug
      # fails fast and loud (network-blocked below) instead of quietly
      # reading/writing production data again. If a genuine live-Airtable
      # integration test is ever needed, it belongs in its own CI job with
      # its own secret pointing at a dedicated CI-only Airtable base —
      # never this job, never production. (See conftest.py's
      # airtable/live/integration pytest markers — already excluded from
      # every CI run today; there is currently no job that runs them.)
      AIRTABLE_API_KEY: "fake-ci-key-not-real"
      AIRTABLE_BASE_ID: "appFAKE00000000000"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      # fetch-depth: 0 (full history) — required by
      # tools/context_librarian/librarian.py's freshness check, which runs
      # `git diff --name-only <last_verified_commit> --` against arbitrary
      # historical commits recorded in the catalog. The default shallow
      # clone (fetch-depth: 1) doesn't contain those commits, so `git diff`
      # fails with exit 128 ("unknown revision") — this is exactly the
      # failure the new "pytest context librarian" step below caught on its
      # first real CI run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Block network egress to Airtable (defense-in-depth, PATCH 3B Step 6 prerequisite)
        run: |
          # Belt-and-braces alongside the fake credentials above: even if a
          # future bug reintroduces an unmocked call, or someone re-adds a
          # real secret here by mistake, it fails fast with a connection
          # error instead of silently reaching api.airtable.com.
          echo "127.0.0.1 api.airtable.com" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Smoke tests
        run: python smoke_tests.py

      - name: Core import check
        run: python -c "import app; import tma_api; import tools.dispatcher"

      - name: Context Librarian catalog validation (N17 item 4 — CI drift detection)
        run: python -m tools.context_librarian validate

      - name: Context Librarian authoritative post-merge refresh check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m tools.context_librarian refresh-after-merge --check

      - name: Run test_*.py scripts
        run: |
          set -e
          for f in test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Schema governance (warning only, never blocks)
        run: python tools/schema_governance.py || true

      - name: F52 gateway bypass audit (warning only, never blocks)
        run: python tools/audit_gateway_bypass.py || true

      - name: F52 result-parsing audit (warning only, never blocks)
        run: python tools/audit_result_parsing.py || true

      - name: Dispatcher bypass audit (warning only, never blocks)
        run: python tools/audit_dispatcher_bypass.py || true

      - name: pytest collect
        run: |
          python -m pytest --collect-only -q \
            -m "not airtable and not live and not integration" \
            test_decision_confidence.py \
            test_decision_attention.py \
            test_decision_orchestrator.py \
            test_decision_trust.py \
            test_decision_readiness.py \
            test_decision_auto_ingestion.py \
            test_core_reasoning.py

      - name: pytest core reasoning
        run: |
          python -m pytest \
            test_decision_confidence.py \
            test_decision_attention.py \
            test_decision_orchestrator.py \
            test_decision_trust.py \
            test_decision_readiness.py \
            test_decision_auto_ingestion.py \
            test_core_reasoning.py \
            -m "not airtable and not live and not integration" \
            -x \
            --tb=short \
            -q

      # N17 item 4 — CI drift fix: test_context_librarian.py uses pytest
      # fixtures/parametrize with no `if __name__` runner, so the plain
      # "Run test_*.py scripts" loop above silently executes it as a no-op
      # (exits 0 having run zero of its tests). This step is what actually
      # exercises the librarian's own test suite in CI.
      - name: pytest context librarian
        run: python -m pytest test_context_librarian.py -x --tb=short -q

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (skipped if tma-frontend/package.json is absent)
        run: |
          if [ ! -f tma-frontend/package.json ]; then
            echo "frontend skipped — no package.json"
            exit 0
          fi
          cd tma-frontend
          npm ci
          npm run build
