name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  classify-change:
    runs-on: ubuntu-latest
    outputs:
      backend_required: ${{ steps.classify.outputs.backend_required }}
      frontend_required: ${{ steps.classify.outputs.frontend_required }}
      governance_required: ${{ steps.classify.outputs.governance_required }}
      librarian_required: ${{ steps.classify.outputs.librarian_required }}
      full_ci_required: ${{ steps.classify.outputs.full_ci_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for the universal PR gate
        run: pip install -r requirements.txt

      - name: Classify changed paths (fail-safe)
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci_change_classifier.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      # Universal blocking PR gate; lightweight routes must not bypass source
      # ownership decisions.
      - name: Context Librarian pre-merge owner decision gate
        if: github.event_name == 'pull_request'
        run: |
          set +e
          python -m tools.context_librarian reconcile-pr \
            --base-ref origin/main \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --summary-output /tmp/librarian_pr_summary.md
          status=$?
          set -e
          if [ -f /tmp/librarian_pr_summary.md ]; then
            cat /tmp/librarian_pr_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  status-sync:
    needs: classify-change
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.classify-change.outputs.governance_required == 'true' ||
      needs.classify-change.outputs.full_ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Blocking current-state status sync
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            MAIN_REF="$BASE_SHA"
          else
            MAIN_REF="$HEAD_SHA"
          fi
          python tools/status_sync_validator.py \
            --repo-root . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --main-ref "$MAIN_REF"

  backend-ci:
    needs: classify-change
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.classify-change.outputs.full_ci_required == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boss_bot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boss_bot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Test-only PostgreSQL service for the durable turn-state contract.
      # This is never a production or staging credential.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boss_bot_ci
      # PATCH 3B Step 6 prerequisite: these are NOT real credentials. A real
      # AIRTABLE_API_KEY/AIRTABLE_BASE_ID (secrets.*) used to be wired here,
      # and a test-isolation bug in test_emergency_stop_bootstrap.py (fixed
      # in commit 1967dd4) let assertions run outside their mock context —
      # which meant those calls silently succeeded against the LIVE
      # production Emergency Stop Flags table instead of failing loudly.
      # Fixing that one bug isn't enough: unit CI must never hold real
      # Airtable credentials at all, so any *future* test-isolation bug
      # fails fast and loud (network-blocked below) instead of quietly
      # reading/writing production data again. If a genuine live-Airtable
      # integration test is ever needed, it belongs in its own CI job with
      # its own secret pointing at a dedicated CI-only Airtable base —
      # never this job, never production. (See conftest.py's
      # airtable/live/integration pytest markers — already excluded from
      # every CI run today; there is currently no job that runs them.)
      AIRTABLE_API_KEY: "fake-ci-key-not-real"
      AIRTABLE_BASE_ID: "appFAKE00000000000"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      # fetch-depth: 0 (full history) — required by
      # tools/context_librarian/librarian.py's freshness check, which runs
      # `git diff --name-only <last_verified_commit> --` against arbitrary
      # historical commits recorded in the catalog. The default shallow
      # clone (fetch-depth: 1) doesn't contain those commits, so `git diff`
      # fails with exit 128 ("unknown revision") — this is exactly the
      # failure the new "pytest context librarian" step below caught on its
      # first real CI run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Block network egress to Airtable (defense-in-depth, PATCH 3B Step 6 prerequisite)
        run: |
          # Belt-and-braces alongside the fake credentials above: even if a
          # future bug reintroduces an unmocked call, or someone re-adds a
          # real secret here by mistake, it fails fast with a connection
          # error instead of silently reaching api.airtable.com.
          echo "127.0.0.1 api.airtable.com" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Initialize PostgreSQL schema
        run: python -m core.database_migrations

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Smoke tests
        run: python smoke_tests.py

      - name: Core import check
        run: python -c "import app; import tma_api; import tools.dispatcher"

      - name: Context Librarian catalog validation (N17 item 4 — CI drift detection)
        run: python -m tools.context_librarian validate

      - name: Context Librarian budget growth signal (warning band; hard ceiling blocks)
        run: python -m tools.context_librarian budget-preflight --all-profiles

      # Three-outcome reconciliation (CLEAN / AUTO_MAINTENANCE_REQUIRED /
      # OWNER_DECISION_REQUIRED) replaces the old binary CHANGES_REQUIRED
      # gate here — see docs/context_librarian/RECONCILIATION.md. Only
      # OWNER_DECISION_REQUIRED blocks: an unrelated main SHA advance, an
      # inert doc/image appearing, or a source matching an already-approved
      # policy class must never fail this job by themselves.
      - name: Context Librarian authoritative post-merge reconciliation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m tools.context_librarian reconcile --check

      - name: Run test_*.py scripts
        run: |
          set -e
          # docs/audit/CI_TEST_HARNESS_FALSE_PASS_20260830.md: a test_*.py file
          # with bare `def test_*()` functions and no __main__/sys.exit runner
          # of its own executes ZERO of them under plain `python "$f"` — it
          # silently exits 0 having tested nothing. ~120 files were found in
          # this exact state (some already known — see the `pytest ...`
          # steps below for context_librarian/decision/*/durable_lifecycle,
          # added one at a time as each was separately discovered; this loop
          # now detects the whole class generically instead of requiring a
          # new named step per future occurrence).
          #
          # KNOWN_PYTEST_FAILURES: files newly proven (by this same audit) to
          # define real `def test_*()` functions that FAIL once actually run
          # — genuine pre-existing gaps this audit surfaced, unrelated to the
          # harness fix itself. Carved out here (same precedent as the
          # DATABASE_URL case below) so turning on real execution for ~180
          # other files doesn't also flip this whole job red for findings
          # that need their own separate fix. Tracked in
          # docs/audit/CI_TEST_HARNESS_FALSE_PASS_20260830.md — remove an
          # entry here once it's fixed, don't add new ones without triage.
          # ALREADY_COVERED: these already get their own dedicated `pytest`
          # step later in this same job (see below) — left on the plain
          # `python "$f"` no-op path here so they don't run twice.
          ALREADY_COVERED="test_status_sync_validator.py test_decision_confidence.py test_decision_attention.py test_decision_orchestrator.py test_decision_trust.py test_decision_readiness.py test_decision_auto_ingestion.py test_core_reasoning.py test_context_librarian.py test_refresh_after_merge.py test_reconcile.py test_phase_4b_1b_durable_lifecycle.py"
          KNOWN_PYTEST_FAILURES="test_business_tool_registry.py test_dev_registry_validator.py test_phase_4b0_1b_concurrency_regression.py test_provider_portability_envelope1d.py test_session_store_contract.py test_audit_dispatcher_bypass_enforcement.py"
          for f in test_*.py; do
            echo "::group::$f"
            if [ "$f" = "test_phase_4b0_1a_atomic_claims.py" ]; then
              # This infrastructure test intentionally verifies the no-DB
              # fail-closed path; keep the CI service available to all other
              # backend tests without changing that explicit scenario.
              env -u DATABASE_URL python "$f"
            elif echo "$ALREADY_COVERED" | grep -qw "$f"; then
              python "$f"
            elif echo "$KNOWN_PYTEST_FAILURES" | grep -qw "$f"; then
              python -m pytest -m "not integration and not airtable and not live" "$f" --tb=short -q || true
            elif grep -qE '^def test_|^    def test_' "$f"; then
              python -m pytest -m "not integration and not airtable and not live" "$f" -x --tb=short -q
            else
              python "$f"
            fi
            echo "::endgroup::"
          done

      - name: TC10 isolated regression matrix (Turn Coordinator / ActionGateway)
        run: |
          python3 scripts/run_isolated_regression.py --repeat 2 \
            --evidence-path tc10_isolated_regression_evidence.json

      - name: Upload TC10 isolated regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc10-isolated-regression-evidence
          path: tc10_isolated_regression_evidence.json
          retention-days: 30

      - name: Schema governance (warning only, never blocks)
        run: python tools/schema_governance.py || true

      - name: Canonical Active Work Registry validation
        run: python tools/dev_registry_validator.py

      - name: Status sync validator tests (blocking)
        run: python -m pytest test_status_sync_validator.py -x --tb=short -q

      - name: Airtable boundary guard (blocking)
        run: python tools/audit_gateway_bypass.py --boundary

      - name: Core provider boundary guard (blocking)
        run: python tools/audit_provider_boundary.py

      - name: Direct model / agent call boundary guard (blocking)
        run: python tools/audit_model_call_boundary.py

      - name: F52 result-parsing audit (warning only, never blocks)
        run: python tools/audit_result_parsing.py || true

      - name: Dispatcher bypass audit (blocking — stable identity hardened)
        run: python tools/audit_dispatcher_bypass.py

      - name: Writer / authority registration guard (blocking)
        run: python tools/audit_writer_authority_registration.py

      - name: Public renderer / MessageContract freeze (blocking — AST-only detection)
        run: python tools/audit_public_renderer_contract.py

      - name: Airtable formula escaping boundary (blocking — AST-only detection, Audit #11 #11-3)
        run: python tools/audit_formula_escaping_boundary.py

      - name: pytest collect
        run: |
          python -m pytest --collect-only -q \
            -m "not airtable and not live and not integration" \
            test_decision_confidence.py \
            test_decision_attention.py \
            test_decision_orchestrator.py \
            test_decision_trust.py \
            test_decision_readiness.py \
            test_decision_auto_ingestion.py \
            test_core_reasoning.py

      - name: pytest core reasoning
        run: |
          python -m pytest \
            test_decision_confidence.py \
            test_decision_attention.py \
            test_decision_orchestrator.py \
            test_decision_trust.py \
            test_decision_readiness.py \
            test_decision_auto_ingestion.py \
            test_core_reasoning.py \
            -m "not airtable and not live and not integration" \
            -x \
            --tb=short \
            -q

      # N17 item 4 — CI drift fix: test_context_librarian.py uses pytest
      # fixtures/parametrize with no `if __name__` runner, so the plain
      # "Run test_*.py scripts" loop above silently executes it as a no-op
      # (exits 0 having run zero of its tests). This step is what actually
      # exercises the librarian's own test suite in CI.
      - name: pytest context librarian
        run: python -m pytest test_context_librarian.py -x --tb=short -q

      - name: pytest context librarian freshness automation
        run: python -m pytest test_refresh_after_merge.py -x --tb=short -q

      - name: pytest context librarian reconciliation
        run: python -m pytest test_reconcile.py -x --tb=short -q

      # Audit #8-2 — same silent-no-op failure mode as the Context Librarian
      # files above: test_phase_4b_1b_durable_lifecycle.py uses pytest
      # fixtures/pytest.raises with no `if __name__` runner, so the plain
      # "Run test_*.py scripts" loop silently executes 0 of its tests (exit
      # 0). This is the only regression in the repo proving
      # ALLOWED_CONTRACT_TRANSITIONS legality enforcement on the real
      # ActionContractRepository — this step is what actually exercises it.
      - name: pytest ActionContract durable lifecycle (Audit #8-2)
        run: python -m pytest test_phase_4b_1b_durable_lifecycle.py -x --tb=short -q

      # Verification only — never mutates the catalog in CI. Reports whether
      # any file this PR touched is registered somewhere in the Context
      # Librarian catalog but wasn't re-verified (or is a new file the
      # catalog already claims the directory of, or a broken edge/stale
      # reference at load time). This check remains warning-only; the
      # Airtable boundary guard above is intentionally blocking.
      - name: Context Librarian freshness check (verification only, warning-only rollout)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no comparable base commit (new branch or first push) -- skipping"
          else
            python -m tools.context_librarian.refresh_after_merge --check --base "$BASE_SHA" --head "${{ github.sha }}" || true
          fi

  governance-ci:
    needs: classify-change
    if: >-
      needs.classify-change.outputs.governance_required == 'true' &&
      needs.classify-change.outputs.full_ci_required != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Canonical Active Work Registry validation
        run: python tools/dev_registry_validator.py

      - name: Schema governance (warning only, never blocks)
        run: python tools/schema_governance.py || true

  context-librarian-ci:
    needs: classify-change
    if: >-
      needs.classify-change.outputs.librarian_required == 'true' &&
      needs.classify-change.outputs.full_ci_required != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Context Librarian catalog validation
        run: python -m tools.context_librarian validate

      - name: Context Librarian budget growth signal
        run: python -m tools.context_librarian budget-preflight --all-profiles

      - name: pytest context librarian
        run: python -m pytest test_context_librarian.py -x --tb=short -q

      - name: pytest context librarian freshness automation
        run: python -m pytest test_refresh_after_merge.py -x --tb=short -q

      - name: pytest context librarian reconciliation
        run: python -m pytest test_reconcile.py -x --tb=short -q

  frontend-ci:
    needs: classify-change
    if: needs.classify-change.outputs.frontend_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (skipped if tma-frontend/package.json is absent)
        run: |
          if [ ! -f tma-frontend/package.json ]; then
            echo "frontend skipped — no package.json"
            exit 0
          fi
          cd tma-frontend
          npm ci
          npm run build
